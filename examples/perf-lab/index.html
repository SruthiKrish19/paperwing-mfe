<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Paperwing perf lab</title>
<style>
:root{--ink:#15202b;--muted:#5b6b7b;--line:#e3e8ee;--accent:#2457d6;--bg:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.dark{background:#111826;color:#e6edf6}
.lab{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:22px 26px;min-height:100vh}
.lab h1{font-size:22px;margin:0 0 4px}.lab h1 small{font-weight:500;color:var(--muted);margin-left:10px;font-size:15px}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0 14px}
.mode a{padding:6px 16px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}.mode a.on{background:var(--accent);color:#fff}
body.dark .mode a{color:#e6edf6}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}body.dark .card{background:#1a2234;border-color:#2a3650}
.stats{position:sticky;top:22px;align-self:start}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.stat b{font-size:30px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:13px}
.stat.hot b{color:#a01c1c}.stat.good b{color:#176b3a}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px}td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
input,button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
button{font-weight:600;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:transparent}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:650;background:#eef1f5;color:#4a5968}
.badge.bad{background:#fde7e7;color:#a01c1c}.badge.good{background:#e3f6ea;color:#176b3a}
.explain{color:var(--muted);font-size:13px;margin:0 0 12px}
</style></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
